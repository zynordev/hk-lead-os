name: LeadOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pytest
        run: pip install pytest
      - name: Run Python test suite
        run: pytest -v
      - name: Check JS / MJS syntax
        run: |
          node --check lead_system/dashboard-actions.js
          node --check auth_gateway/server.mjs
          node --check whatsapp_sender/src/server.mjs
